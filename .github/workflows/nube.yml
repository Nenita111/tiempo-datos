# 4.21 (lo pidió Isa el 4 nov 2026: «quiero que sea una dirección html que se pueda ver desde cualquier dispositivo»): la página de la
# tele en internet, https://nenita111.github.io/tiempo-datos/, puesta al día cada media hora (nube/vuelta.sh). Gratis: el repositorio
# es público. Pages, con «Source: GitHub Actions» (activado el 4 nov 2026).
name: Página en internet
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  # también al cambiar la página o la parte de la app que baja los datos (publicar_nube.py): así sale enseguida
  push:
    branches: [main]
    paths: ["nube/**", ".github/workflows/nube.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nube
  cancel-in-progress: false
jobs:
  vuelta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nube
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dependencias (en caché)
        uses: actions/cache@v4
        with:
          path: |
            nube/deps
            nube/android
          key: nube-deps-${{ hashFiles('nube/dependencias.txt') }}
      - name: Lo de la vuelta anterior
        uses: actions/cache/restore@v4
        with:
          path: nube/estado
          key: nube-estado-${{ github.run_id }}
          restore-keys: nube-estado-
      - name: Bajar los datos y montar la página
        run: bash nube/vuelta.sh
      - name: Guardar para la vuelta siguiente
        if: always()
        uses: actions/cache/save@v4
        with:
          path: nube/estado
          key: nube-estado-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nube/web
      - id: publicar
        uses: actions/deploy-pages@v4
