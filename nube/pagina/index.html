<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- la página se dibuja a 1920×1080 y escalar() la encoge o agranda al tamaño real del WebView (en la tele, 1280×720 o 960×540) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tiempo y Radar</title>
<style>
/* Atkinson Hyperlegible Next: diseñada por el Braille Institute para distinguir bien cada letra y cada cifra */
@font-face{font-family:"Atkinson";src:url("fuentes/atkinson.woff2") format("woff2");font-weight:200 800;font-display:block}
:root{
  --bg:#0a0f16;--tx:#eef2f7;--tx2:#c4cdda;--mu:#8e9cb1;--mu2:#6f7d93;
  --acc:#f4a62a;--mar:#62bbff;--ok:#6fd8b4;--mal:#ff7b6b;
  --tile:rgba(14,20,30,.64);--tile2:rgba(255,255,255,.055);--nueva:rgba(255,210,0,.30);--linea:rgba(255,255,255,.09);--sombra:0 0 0 1px rgba(255,255,255,.05) inset;
  --sol:#f7b42c;--nube:#e2e7ef;--nube2:#a3afc0;--nubeo:#6f7a8c;--luna:#e9edf5;--gota:#62bbff;--rayo:#ffd23f;
  --nubeamb:rgba(140,156,182,.22);--nubetorm:rgba(26,30,44,.62);--nieblaamb:rgba(205,215,230,.11);--olacol:rgba(98,187,255,.11);--grano:.5;
}
body.claro{
  --bg:#efebe3;--tx:#1a212c;--tx2:#353f4e;--mu:#5c6777;--mu2:#667082;
  --acc:#b25d08;--mar:#1c6db5;--ok:#157a5b;--mal:#b0392a;
  --tile:rgba(255,255,255,.70);--tile2:rgba(26,33,44,.055);--nueva:#fff09a;--linea:rgba(26,33,44,.10);--sombra:0 18px 40px -20px rgba(70,55,30,.22);
  --sol:#f0a51c;--nube:#b3bfcd;--nube2:#8b98aa;--nubeo:#5f6b80;--luna:#8f9cb1;--gota:#2585d6;--rayo:#f0b400;
  --nubeamb:rgba(140,152,172,.30);--nubetorm:rgba(55,62,82,.40);--nieblaamb:rgba(255,255,255,.62);--olacol:rgba(28,109,181,.11);--grano:.35;
}
*{box-sizing:border-box;margin:0;padding:0}
html{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:Atkinson,sans-serif;color:var(--tx);transform-origin:0 0;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;text-align:justify;-webkit-hyphens:auto;hyphens:auto;
  background:var(--granoimg,none) 0 0/160px 160px,radial-gradient(1400px 800px at 12% -12%,#17243b 0%,rgba(23,36,59,0) 62%),radial-gradient(1100px 700px at 106% 112%,#1e1932 0%,rgba(30,25,50,0) 56%),var(--bg)}
body.claro{background:var(--granoimg,none) 0 0/160px 160px,radial-gradient(1400px 800px at 12% -12%,#fffaf1 0%,rgba(255,250,241,0) 62%),radial-gradient(1100px 700px at 106% 112%,#f3dbbd 0%,rgba(243,219,189,0) 56%),var(--bg)}
.num{font-weight:500;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}

/* ---------- 4.37 y 4.38: el fondo dibujado de cada pantalla (escena), detrás de todo: un paisaje por capas, suave ---------- */
#escena{position:absolute;inset:0;pointer-events:none;z-index:0;color:var(--c1)}#escena svg{position:absolute;inset:0;width:100%;height:100%}
#escena .tema{stroke-opacity:.34}#escena .tema *{vector-effect:non-scaling-stroke}#escena .cielo{opacity:.3}#escena .estacion{opacity:.3}#escena .fiesta{opacity:.55}
body.claro #escena .tema{stroke-opacity:.38}body.claro #escena .cielo{opacity:.28}body.claro #escena .estacion{opacity:.28}
#escena .m1,#escena .m2,#escena .m3,#escena .m4{fill:currentColor;stroke:none}#escena .m1{fill-opacity:.07}#escena .m2{fill-opacity:.12}#escena .m3{fill-opacity:.19}#escena .m4{fill-opacity:.38}
body.claro #escena .m1{fill-opacity:.09}body.claro #escena .m2{fill-opacity:.15}body.claro #escena .m3{fill-opacity:.23}
#escena .tema .sol-e{opacity:.5}body.claro #escena .tema .sol-e{opacity:.62}#escena .cielo-sol{opacity:.38}body.claro #escena .cielo-sol{opacity:.46}
#escena .c2{color:var(--c2)}#escena .vent{stroke-opacity:.2;stroke-width:9}#escena .tema .lleno{fill-opacity:.5}
#escena .rel{fill:currentColor;fill-opacity:.2}#escena .lleno{fill:currentColor;stroke:none}#escena .fondo{opacity:.55}
#escena .fi-l{stroke:#c9a227;fill:none}#escena .fi-l .lleno{fill:#f5c400}#escena .calima{fill:#d9a441;opacity:.10;stroke:none}
/* ---------- ambiente animado (detrás de todo) ---------- */
#amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
body:not(.p-ahora):not(.p-mar) #amb{display:none}body.p-mar #amb>div:not(.a-olas){display:none}   /* la animación del tiempo, solo en la pantalla Ahora (lo pidió Isa el 27 oct 2026) */
#amb>div{position:absolute;opacity:0;transition:opacity 2.5s ease}
/* 4.39 (lo pidió Isa el 10 nov 2026: «mejora la apariencia del sol para que sea más realista»): el sol, con su disco (centro casi blanco,
   limbo dorado), la corona pegada y el resplandor que se apaga lejos; al salir y al ponerse (.bajo), anaranjado. A la izquierda del reloj
   (antes, solo un resplandor detrás de él). El disco, 48 px de radio. */
.a-sol{right:-270px;top:-638px;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle closest-side,#fff 0,#fffbe0 4.2%,#ffe680 6.2%,#ffc93d 6.86%,rgba(255,200,84,.78) 7.1%,rgba(255,190,80,.46) 9.5%,rgba(255,180,70,.24) 16%,rgba(255,170,60,.10) 34%,rgba(255,170,60,.035) 62%,rgba(255,170,60,0))}
.a-sol.bajo{background:radial-gradient(circle closest-side,#fff6dc 0,#ffd98a 4%,#ffac4a 6.2%,#f97b2c 6.86%,rgba(250,128,60,.74) 7.1%,rgba(248,120,56,.44) 9.5%,rgba(244,110,52,.24) 16%,rgba(240,104,50,.11) 34%,rgba(236,100,50,.04) 62%,rgba(236,100,50,0))}
body.claro .a-sol{background:radial-gradient(circle closest-side,#fffdf0 0,#fff0a8 4%,#ffd24a 6.1%,#f5a51f 6.86%,rgba(250,176,52,.7) 7.1%,rgba(252,184,66,.42) 9.5%,rgba(255,186,74,.22) 16%,rgba(255,180,66,.10) 34%,rgba(255,174,62,.035) 62%,rgba(255,170,60,0))}
body.claro .a-sol.bajo{background:radial-gradient(circle closest-side,#fff0cc 0,#ffcb78 4%,#ff9d3e 6.1%,#ee6a22 6.86%,rgba(240,112,48,.7) 7.1%,rgba(242,118,54,.42) 9.5%,rgba(244,122,58,.22) 16%,rgba(244,120,56,.10) 34%,rgba(240,110,54,.035) 62%,rgba(240,110,54,0))}
/* 4.26 (lo pidió Isa el 5 nov 2026: «la animación del sol la veo mucho mejor y realista en el PC que en la tele»): los rayos eran un degradado
   cónico con máscara de 1760 px que la tele repintaba a saltos y la calidad automática quitaba (calidad 1); ahora son una imagen hecha una
   vez (rayosSol, con la máscara dentro) que la tarjeta gráfica gira sola, sin repintar: suave en la tele y en todas las calidades (en la 0, quieta) */
.a-rayos{right:-450px;top:-818px;width:1760px;height:1760px;border-radius:50%;background:center/100% 100% no-repeat;will-change:transform;
  animation:gira 150s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.a-luna{right:-260px;top:-320px;width:920px;height:920px;border-radius:50%;background:radial-gradient(closest-side,rgba(200,215,255,.16),rgba(200,215,255,0))}
.a-est{inset:0}.a-est canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
.a-est canvas+canvas{animation:titila 4.5s steps(18) infinite alternate}
@keyframes titila{from{opacity:.1}to{opacity:1}}
@keyframes parpadea{0%,100%{opacity:1}50%{opacity:.12}}
.mc-n{fill:none;stroke:#ff3b30;stroke-width:4;animation:parpadea 1.1s ease-in-out infinite}.mc-n.mn-n{stroke-width:1.3}circle.nuevo{animation:parpadea 1.1s ease-in-out infinite}
.leyenda-m i.nv{background:none;box-shadow:0 0 0 3px #ff3b30 inset;animation:parpadea 1.1s ease-in-out infinite}
.a-nubes{inset:0}.a-nubes i{position:absolute;width:1400px;height:560px;border-radius:50%;background:radial-gradient(closest-side,var(--nubeamb),rgba(0,0,0,0));will-change:transform}
.a-nubes i:nth-child(1){left:-360px;top:-200px;animation:deriva1 120s steps(240) infinite alternate}
.a-nubes i:nth-child(2){left:760px;top:240px;animation:deriva2 160s steps(320) infinite alternate}
.a-nubes i:nth-child(3){left:300px;top:620px;animation:deriva1 190s steps(380) infinite alternate-reverse}
@keyframes deriva1{from{transform:translateX(-180px)}to{transform:translateX(280px)}}
@keyframes deriva2{from{transform:translateX(220px)}to{transform:translateX(-260px)}}
.a-niebla{inset:0}.a-niebla i{position:absolute;left:-500px;width:2900px;height:420px;background:linear-gradient(180deg,rgba(0,0,0,0),var(--nieblaamb),rgba(0,0,0,0));animation:deriva1 55s steps(110) infinite alternate}
.a-niebla i:nth-child(1){top:140px}.a-niebla i:nth-child(2){top:600px;animation-duration:80s;animation-direction:alternate-reverse}
.a-viento{inset:0}
.a-viento i{position:absolute;left:-512px;right:0;top:0;bottom:0;background-image:var(--tex-viento);background-size:512px 256px;animation:sopla var(--vdur,1s) steps(24) infinite;will-change:transform}
#amb[data-vsentido="izq"] .a-viento i{animation-direction:reverse}
@keyframes sopla{to{transform:translateX(512px)}}
.a-lluvia{inset:0}
.a-lluvia i{position:absolute;left:0;right:0;top:-256px;bottom:0;background-image:var(--tex-lluvia);background-size:calc(256px * var(--lesc,1)) calc(256px * var(--lesc,1));animation:cae var(--ldur,.5s) steps(12) infinite;will-change:transform}
@keyframes cae{to{transform:translateY(256px)}}
.a-rayo{inset:0;background:rgba(236,241,255,.92);animation:rayo var(--rdur,11s) linear infinite}
@keyframes rayo{0%,89%,100%{opacity:0}90%{opacity:.5}91%{opacity:0}92.5%{opacity:.32}94%{opacity:0}}
.a-calor{inset:0;background:radial-gradient(1700px 760px at 50% 118%,rgba(255,118,40,.30),rgba(255,118,40,0) 70%)}
.a-calor::before{content:"";position:absolute;inset:0;background:radial-gradient(1300px 520px at 50% 112%,rgba(255,80,30,.20),rgba(255,80,30,0));animation:late 4s steps(20) infinite alternate}
.a-calor::after{content:"";position:absolute;left:0;right:0;bottom:-40px;height:640px;background:repeating-linear-gradient(0deg,rgba(255,170,90,0) 0 28px,rgba(255,170,90,.06) 28px 36px);
  -webkit-mask-image:linear-gradient(0deg,#000,rgba(0,0,0,0));animation:sube 5s steps(36) infinite}
@keyframes late{from{opacity:.35}to{opacity:1}}@keyframes sube{to{transform:translateY(-36px)}}
.a-frio{inset:0;background:radial-gradient(1900px 720px at 50% -14%,rgba(150,200,255,.24),rgba(150,200,255,0) 70%)}
.a-calima{inset:-120px;background:radial-gradient(1400px 820px at 30% 40%,rgba(214,160,90,.26),rgba(214,160,90,0) 70%),radial-gradient(1200px 700px at 80% 85%,rgba(200,140,70,.22),rgba(200,140,70,0) 70%);animation:deriva1 46s steps(92) infinite alternate}
.a-olas{left:0;right:0;bottom:0;height:280px;transform-origin:50% 100%;transform:scaleY(var(--olak,.4))}
.a-olas svg{position:absolute;bottom:0;left:0;width:3840px;height:280px;animation:ola var(--oladur,14s) steps(280) infinite;will-change:transform}
.a-olas svg+svg{animation-duration:calc(var(--oladur,14s) * 1.45);animation-direction:reverse}
.a-olas path{fill:var(--olacol)}
@keyframes ola{to{transform:translateX(-1920px)}}

/* calidad automática: 2 completa · 1 ligera (sin capas dobles) · 0 mínima (fondos quietos) */
html[data-calidad="1"] .a-olas svg+svg,html[data-calidad="0"] .a-olas svg+svg{display:none}
html[data-calidad="1"] .a-est canvas+canvas,html[data-calidad="1"] .a-calor::after,html[data-calidad="1"] .nueva .tile{animation:none}
html[data-calidad="0"] #amb *,html[data-calidad="0"] #amb *::before,html[data-calidad="0"] #amb *::after,html[data-calidad="0"] .tile,html[data-calidad="0"] .alarma::after{animation:none!important}

/* ---------- estructura ---------- */
.wrap{position:absolute;inset:38px 60px 28px;display:flex;flex-direction:column;gap:22px;z-index:1;transition:transform 2s}
header{height:126px;flex:none;display:flex;justify-content:space-between;align-items:flex-end}
.lugar h1{font-weight:800;font-size:68px;line-height:1;letter-spacing:-.02em;white-space:nowrap;max-width:1180px;overflow:hidden;text-overflow:ellipsis}
.lugar p{margin-top:14px;font-size:22px;color:var(--mu);display:flex;gap:14px;align-items:center;font-weight:600}
.reloj{text-align:right}
.reloj b{display:block;font-weight:300;font-size:112px;line-height:.84;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.reloj span{display:block;margin-top:10px;font-size:23px;color:var(--mu);font-weight:600}
.chips{display:inline-flex;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;font-size:20px;font-weight:700}
.ok{background:rgba(111,216,180,.15);color:var(--ok)}
.av1{background:#f5c518;color:#1b1600}.av2{background:#ff8c1a;color:#1d0c00}.av3{background:#e53935;color:#fff}
.lluvia{background:#1e6fd9;color:#fff}.fuego{background:#ef8504;color:#1d0c00}.polvo{background:#c9a26b;color:#1d1200}
.chip.llama{background:#d63a1c;color:#fff}.chip.temporal{background:#0b4f8a;color:#fff}.olas3 .tmp-t{color:var(--mal);font-style:normal}.olas3 .tmp strong{color:var(--mal)}.chip.uv{background:#8e44ad;color:#fff}.chip.polen{background:#c7a400;color:#1d1600}.chip.aire{color:#fff}.chip.nueva-v{background:var(--tile2);color:var(--tx)}
.con-ab .pm .cel{min-height:72px;padding:4px 14px}.con-ab .ab{margin-top:8px}
.ab{font-size:20px;color:var(--tx2);font-weight:600;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ab b{color:var(--ok)}.ab b.mal{color:var(--mal)}
.main{flex:1;min-height:0;display:grid;gap:22px}
.col{display:grid;gap:22px;min-height:0}
.tile{background:var(--velo,none),var(--tile);border-radius:30px;padding:24px 30px;position:relative;overflow:hidden;min-height:0;box-shadow:var(--sombra)}
.nueva .tile{animation:entra .9s cubic-bezier(.16,.84,.3,1) both;animation-delay:calc(var(--i,0) * 80ms)}
@keyframes entra{from{opacity:0;transform:translateY(22px)}}
.k{font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:800;display:flex;gap:16px;align-items:baseline;margin-bottom:16px;white-space:nowrap}
.k em{margin-left:auto;font-style:normal;letter-spacing:.01em;text-transform:none;color:var(--tx2);font-weight:600;font-size:20px;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mu)}
.nota{font-size:20px;color:var(--mu2);margin-top:12px;font-weight:500}
.vacio{display:grid;place-items:center;text-align:center;color:var(--mu);font-size:24px;line-height:1.5}
footer{height:46px;flex:none;display:flex;justify-content:space-between;align-items:center;gap:40px}
.tabs{display:flex;gap:34px;flex:none}.tabs.muchas{gap:22px}.tabs.muchas .tab{font-size:20px}.tabs.muchas .tab i{min-width:56px}
.tab{display:flex;flex-direction:column;gap:8px;font-size:21px;font-weight:700;color:var(--mu2)}
.tab i{display:block;height:4px;border-radius:2px;background:var(--linea);overflow:hidden;min-width:70px}
.tab.on{color:var(--tx)}.tab u{display:block;height:100%;background:var(--acc);transform-origin:0 50%;animation:avanza steps(150) both}
.tab u.lleno{animation:none}.tab.mas{color:var(--mu2);justify-content:flex-start}
@keyframes avanza{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fuente{font-size:20px;color:var(--mu2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

/* iconos del tiempo (dibujados, no emoji) */
.wi{display:block;overflow:visible;flex:none}
.w-sol .w-rayos{fill:var(--sol);opacity:.9}
.w-nube{fill:var(--nube)}.w-nube2{fill:var(--nube2)}.w-nubeo{fill:var(--nubeo)}.w-luna{fill:var(--luna)}
.w-gota{stroke:var(--gota);stroke-width:4;stroke-linecap:round}.w-rayo{fill:var(--rayo)}.w-copo{fill:var(--tx2)}
.w-niebla{stroke:var(--nube2);stroke-width:4.5;stroke-linecap:round}
.g{display:inline-block;width:13px;height:18px;vertical-align:-2px;margin-right:6px;fill:var(--gota)}.g.r{fill:var(--rayo)}.horas small.tor{color:var(--rayo)}
.tormenta{background:#2a2f45;color:#ffd23f}
.leyenda{font-size:20px;color:var(--mu);font-weight:600;margin-top:4px}.leyenda i{display:inline-block;width:14px;height:14px;border-radius:3px;margin:0 8px -1px 0}.leyenda i+span{margin-right:22px}

/* ---------- 1. ahora ---------- */
.p-ahora .main{grid-template-columns:1120px 1fr}
.p-ahora .col{grid-template-rows:1fr auto auto}
.mapa{padding:0;background:#0d1828}
.mapa canvas{width:100%;height:100%;display:block;object-fit:cover}
.tag{position:absolute;left:22px;top:22px;background:rgba(9,14,24,.82);color:#eef2f7;padding:10px 18px;border-radius:14px;font-size:21px;font-weight:600}
.alerta{position:absolute;left:22px;top:80px;background:#1e6fd9;color:#fff;padding:10px 18px;border-radius:14px;font-size:22px;font-weight:700}
.ley{position:absolute;right:22px;bottom:26px;display:flex;align-items:center;gap:10px;background:rgba(9,14,24,.82);padding:10px 16px;border-radius:14px;font-size:20px;color:#c4cdda;font-weight:600}
.ley i{width:170px;height:12px;border-radius:6px;background:linear-gradient(90deg,#0000fc,#0094fc,#00fcfc,#438323,#00c000,#00ff00,#ffff00,#ff8800,#ff0000)}
.prog{position:absolute;left:22px;right:22px;bottom:10px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}.prog u{display:block;height:4px;border-radius:2px;background:#f4a62a}
.hero{display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.ya{display:flex;align-items:center;gap:24px}
.t0{font-size:124px;line-height:.8;font-weight:400;letter-spacing:-.04em}
.desc{font-size:30px;color:var(--tx2);margin-top:10px;font-weight:600}
.titular{font-size:24px;font-weight:700;color:var(--acc);line-height:1.3;display:flex;align-items:center;gap:10px;flex:none}
.punto{width:14px;height:14px;border-radius:50%;flex:none}
.salir{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:22px;padding:11px 16px;border-radius:16px;background:rgba(111,216,180,.13);color:var(--tx2);font-weight:500}.salir b{color:var(--tx);font-weight:800}
.salir.malo{background:rgba(255,123,107,.13)}
.datos{font-size:23px;color:var(--mu);font-weight:600;white-space:normal;line-height:1.4}.datos>span{white-space:nowrap}.datos b{color:var(--tx);font-weight:800;margin-right:4px}
.horas{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center}
.horas div{display:flex;flex-direction:column;align-items:center;gap:6px}
.horas span{font-size:21px;color:var(--mu);font-weight:700}.horas b{font-size:34px;line-height:1;font-weight:800}.horas small{font-size:20px;color:var(--gota);font-weight:700;min-height:23px}
.cm{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px}
.cm div{display:flex;align-items:center;gap:10px;min-width:0}
.cm p{min-width:0}.cm span{display:block;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.cm b{display:block;font-size:30px;line-height:1.1;font-weight:800}

/* ---------- 2. semana ---------- */
.p-semana .main{grid-template-columns:1fr;grid-template-rows:1fr 392px}
.semana{grid-column:1/-1;display:flex;flex-direction:column}.semana.sola{grid-column:auto}.semana.sola .dia{padding:26px 6px 30px}.semana.sola .dia>b{font-size:30px}.semana.sola .dia small{font-size:22px}
.dias{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:12px;min-height:0}
.dia{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 6px 16px;border-radius:24px;text-align:center}
.dia.hoy{background:rgba(244,166,42,.10);box-shadow:inset 0 0 0 2px rgba(244,166,42,.42)}
.dia.hoy>b:first-child{text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:4px;text-underline-offset:7px}.dia.pasado{opacity:.55}

    radial-gradient(1250px 820px at 4% -16%,hsla(var(--h),88%,46%,.34),hsla(var(--h),88%,46%,0) 64%),
    radial-gradient(1150px 780px at 106% 114%,hsla(var(--h2),82%,48%,.26),hsla(var(--h2),82%,48%,0) 62%),
    radial-gradient(820px 540px at 68% -22%,hsla(var(--h2),85%,62%,.10),hsla(var(--h2),85%,62%,0) 70%),
    var(--bg)}
body.claro{--c1:hsl(var(--h),74%,37%);--c2:hsl(var(--h2),68%,40%);--c1s:hsla(var(--h),80%,45%,.28);--kc:hsl(var(--h),52%,33%);
  --tile2:hsla(var(--h),45%,38%,.07);--linea:hsla(var(--h),30%,25%,.11);
  --velo:linear-gradient(162deg,rgba(255,255,255,.78),hsla(var(--h),70%,96%,.30) 46%,rgba(255,255,255,.52));
  --sombra:inset 0 1px 0 rgba(255,255,255,.96),inset 0 0 0 1px hsla(var(--h),30%,25%,.07),0 30px 56px -32px hsla(var(--h),40%,22%,.34);
  background:var(--granoimg,none) 0 0/160px 160px,
    radial-gradient(hsla(var(--h),30%,25%,.07) 1.1px,rgba(0,0,0,0) 1.7px) 0 0/34px 34px,
    radial-gradient(1250px 820px at 4% -16%,hsla(var(--h),90%,80%,.55),hsla(var(--h),90%,80%,0) 64%),
    radial-gradient(1150px 780px at 106% 114%,hsla(var(--h2),85%,78%,.48),hsla(var(--h2),85%,78%,0) 62%),
    var(--bg)}
/* el filo de color arriba de cada tarjeta */
.tile::before{content:"";position:absolute;left:30px;top:0;width:76px;height:4px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--c1),var(--c2));
  box-shadow:0 0 18px var(--c1s);z-index:3;pointer-events:none}
.mapa::before,.foto::before,.cam::before{left:26px}
/* títulos de las tarjetas en el color de la pantalla */
.k{color:var(--kc)}
/* el sitio y el reloj, con un brillo del color de la pantalla */
.lugar h1{background:linear-gradient(100deg,var(--tx) 38%,var(--c1) 135%);-webkit-background-clip:text;background-clip:text;color:transparent}
.reloj b{background:linear-gradient(180deg,var(--tx) 34%,var(--c1) 175%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* la pestaña de la pantalla que se ve: en su color, con la barra del tiempo que le queda encendida */
.tab.on{color:var(--c1)}
.tab u{background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 12px var(--c1s)}
.tab i{background:var(--linea)}
.tab.on{position:relative}
.tab.on::before{content:"";position:absolute;inset:-7px -12px -6px;border-radius:12px;z-index:-1;
  background:linear-gradient(90deg,hsla(var(--h),90%,60%,.18),hsla(var(--h2),90%,60%,.10));box-shadow:inset 0 0 0 1px hsla(var(--h),90%,70%,.22)}
body.claro .tab.on::before{background:linear-gradient(90deg,hsla(var(--h),80%,45%,.12),hsla(var(--h2),80%,45%,.07));box-shadow:inset 0 0 0 1px hsla(var(--h),60%,35%,.16)}
/* la temperatura de ahora, en grande, con el brillo de la pantalla */
.t0{background:linear-gradient(180deg,var(--tx) 30%,var(--c1) 190%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
/* avisos de arriba: píldoras con filo */
.chip{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 10px 24px -14px rgba(0,0,0,.7)}
body.claro .chip{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 10px 22px -14px rgba(60,40,20,.4)}
@keyframes entra{from{opacity:0;transform:translateY(20px) scale(.985)}}

/* ---------- 4.5: los trenes de Renfe ---------- */
.trenes-m{display:flex;flex-direction:column}.tr-mapa{position:relative;flex:1;min-height:300px;margin-top:4px;border-radius:16px;overflow:hidden;background:#0b1830}

.tr-ley span{display:flex;align-items:center;gap:7px;white-space:nowrap}.tr-ley i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(8,14,26,.9)}.tr-ley b{color:#fff}

.tr-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tr-chips span{background:var(--tile2);border-radius:999px;padding:5px 13px;font-size:20px;font-weight:700;color:var(--tx2);white-space:nowrap}.tr-chips b{color:var(--c1)}
.tr-l{list-style:none;display:grid;gap:8px}.tr-l.dos{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:10px}
.tr-l li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;align-items:baseline;padding:8px 14px;border-radius:14px;background:var(--tile2)}
.tr-l li b{font-size:21px;font-weight:800;color:var(--tx);text-align:left}.tr-l li small{grid-column:2/4;font-size:20px;font-weight:600;color:var(--mu);text-align:left;line-height:1.3}

.tr-l .tr-h{grid-row:1/3;align-self:center;font-size:20px;font-weight:800;color:var(--c1);white-space:nowrap;text-align:left}.tr-l .tr-h.mut{color:var(--mu)}.tr-l .tr-h small{color:var(--tx2);font-size:20px}
.tr-nada{font-size:21px;font-weight:600;line-height:1.4}

.tr-qr svg.qr{width:84px;height:84px}.tr-qr span{font-size:20px;line-height:1.2;font-weight:800;color:#c4cdda;text-align:center}
/* ---------- 4.3: el autobús (Carretera) ---------- */
.bus .bus-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:26px;align-items:start}
.bus-t{font-size:20px;font-weight:800;color:var(--tx2);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bus-t span{color:var(--c1)}
.bus ul{list-style:none;display:grid;gap:8px}
.bus li{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:baseline;padding:8px 14px;border-radius:14px;background:var(--tile2)}
.bus li b{font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.01em;text-align:left}
.bus li span{font-size:20px;color:var(--tx2);font-weight:600;text-align:left;white-space:normal;line-height:1.25}
.bus li i{grid-column:1/-1;font-style:normal;font-size:20px;color:var(--mu);font-weight:700;letter-spacing:.02em;margin-top:2px;text-align:left}

/* ---------- 4.3: el menú de ajustes de las pantallas (≡ en el mando) ---------- */
#menu{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,7,12,.72)}

.mn{width:1500px;border-radius:34px;padding:36px 44px 30px;background:var(--velo,none),#0f1622;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.07),0 40px 90px -30px rgba(0,0,0,.85)}
body.claro .mn{background:var(--velo,none),#f7f3ec}
.mn::before{content:"";display:block;width:96px;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 18px var(--c1s);margin-bottom:22px}
.mn-k{display:flex;align-items:baseline;gap:22px;font-size:36px;font-weight:800;letter-spacing:-.01em;margin-bottom:22px}.mn-k em{margin-left:auto;font-style:normal;font-size:20px;color:var(--mu);font-weight:600}
.mn ol{list-style:none;display:grid;grid-auto-flow:column;grid-template-rows:repeat(12,auto);grid-template-columns:1fr 1fr;column-gap:26px;row-gap:6px}

.mn li b{font-weight:800}.mn li em{font-style:normal;font-size:20px;color:var(--mu);font-weight:600}
.mn li .mn-v{margin-left:auto;font-size:20px;font-weight:800;padding:4px 12px;border-radius:999px;background:hsla(150,70%,45%,.18);color:var(--ok)}

.mn li .mn-s{min-width:120px;text-align:right;font-size:20px;font-weight:700;color:var(--tx2)}
.mn li.mn-x b{color:var(--c1)}.mn li.mn-x span{margin-left:auto;font-size:20px;color:var(--mu);font-weight:600}
/* 4.26: con más pantallas, filas más bajas para que el menú quepa entero */
.mn ol.apretado{row-gap:3px}.mn ol.apretado li{min-height:44px;padding:5px 18px;font-size:22px}
/* 4.28: con 30 pantallas o más, aún más bajas (el menú se pasaba de los 1080 px) */
.mn ol.apretado2 li{min-height:39px;padding:3px 18px;font-size:21px}.mn ol.apretado2 li .mn-s{font-size:20px}
.mn li.sel{background:var(--tile2);box-shadow:inset 0 0 0 3px var(--c1),0 0 26px -6px var(--c1s)}
.polvo{display:flex;flex-direction:column}.polvo .marco{position:relative;flex:1;min-height:200px;border-radius:14px;overflow:hidden;background:#fff}
.polvo .marco img{width:100%;height:100%;object-fit:contain;display:block}.polvo .tag{left:12px;top:12px;font-size:20px;padding:8px 14px}
.polvo .polvo-e{display:block;width:100%;height:auto;margin-top:10px;border-radius:6px;background:#fff}
/* 4.27: Inundaciones y ozono */
.inund{display:flex;flex-direction:column}.inund-f{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 740px;gap:24px}
.inund-m{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}.inund-m .marco{flex:1;min-height:0;max-width:100%}.inund-m .nota{align-self:stretch;margin:0}
.inund-r{position:absolute;border:3px solid #ffd23f;border-radius:4px;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.inund-ra{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px dashed #ffd23f;box-shadow:0 0 0 2px rgba(0,0,0,.35);pointer-events:none}
.acu-n{position:absolute;transform:translate(-50%,-50%);font-size:20px;font-weight:800;color:#fff;background:rgba(10,18,30,.72);border-radius:8px;padding:2px 9px;white-space:nowrap;border-left:6px solid #3fb950}.acu-n.malo{border-left-color:#e53935}.acu-n.der{transform:translate(-100%,-50%)}.acu-n.izq{transform:translate(0,-50%)}

.acu-cerca .ac-f{display:flex;gap:9px;align-items:flex-start;font-size:20px;line-height:1.2;margin-top:5px}.acu-cerca .ac-f>i{flex:none;width:14px;height:14px;border-radius:4px;margin-top:5px;background:#3fb950}.acu-cerca .ac-f>i.malo{background:#e53935}
.acu-cerca .ac-f b{font-weight:800}.acu-cerca .ac-f u{text-decoration:none;color:#ffd23f;font-weight:800}.acu-cerca small{display:block;font-size:20px;color:#c9d4e0;font-weight:500}.acu-cerca small em{font-style:normal;font-weight:800}
.inund-z{margin:0 0 14px}.inund-z .marco{position:relative;width:100%;border-radius:14px;overflow:hidden;border:3px solid #ffd23f}
.inund-z figcaption{font-size:20px;font-weight:700;color:var(--tx2);margin-top:6px;text-align:left}.inund-l{display:flex;flex-direction:column;min-height:0}
.inund .marco{position:relative;border-radius:16px;overflow:hidden;background:#0c1826}.inund .marco img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.inund .marco img.capa{transition:opacity 1s}.inund .tag{left:14px;top:14px}
.inund-l ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}.inund-l li{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;padding:6px 12px;border-radius:14px;cursor:pointer;color:var(--tx2)}
.inund-l li.on{background:var(--tile2);color:var(--tx);box-shadow:inset 0 0 0 3px var(--c1)}.inund-l li i{width:26px;height:26px;border-radius:7px;flex:none}.inund-l li small{display:block;font-size:20px;color:var(--mu);font-weight:600}.inund-l .nota{margin-top:18px}
.solt .marco{position:relative}.solt .tag{left:10px;top:10px;font-size:20px;padding:6px 12px}.solt .ozono{font-size:20px;margin-top:8px}
/* 4.26: Naturaleza y Tormentas */

.nat-a{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:16px}.nat-a div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}

.nat-at{font-size:20px;color:var(--mu);text-align:left;margin-top:2px}.k.sub{margin-top:14px}
.nat-r{list-style:none}.nat-r li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--linea);font-size:20px}
.nat-r li span{min-width:0;overflow:hidden;white-space:nowrap}.nat-r em{color:var(--mu);font-size:20px}.nat-r small{font-size:20px;color:var(--mu);font-weight:700;white-space:nowrap}
.nat-r small.amen{color:var(--mal)}
.nat-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin-top:6px}.nat-f figure{min-width:0}.nat-f .nf-i{position:relative;border-radius:12px;overflow:hidden;height:136px;background:var(--tile2)}
/* 4.39 (lo pidió Isa el 10 nov 2026: «en fotos de lo visto pon los créditos más pequeños debajo de la foto»): el autor y la licencia, debajo y
   en letra pequeña (.cred: lo único por debajo de los 20 px, porque es la firma de la foto y no un dato) */
.nat-f .cred{display:block;font-size:14px;line-height:1.25;color:var(--mu);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.nat-f img{width:100%;height:100%;object-fit:cover;display:block}.nat-f figcaption{position:absolute;left:0;right:0;bottom:0;padding:12px 8px 4px;background:linear-gradient(transparent,rgba(0,0,0,.34));color:#fff;text-align:left;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.8)}
.nat-f figcaption b{display:block;font-size:20px;line-height:1.15;white-space:nowrap;overflow:hidden}.nat-f figcaption span{display:block;font-size:20px;opacity:.92;white-space:nowrap;overflow:hidden}.nat-datos .nota{margin-top:auto;padding-top:10px}
.tor-max{font-size:24px;margin:4px 0 8px}.tor-barras{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:2px solid var(--linea)}
.tor-barras div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}.tor-barras i{display:block;background:var(--acc);border-radius:3px 3px 0 0}
.tor-barras span{position:absolute;bottom:-26px;left:0;font-size:20px;color:var(--mu);font-weight:700;white-space:nowrap}.tormentas .k.sub{margin-top:40px}
.tor-u,.tor-d{font-size:22px;line-height:1.4;margin-top:6px}.tormentas .nota{margin-top:auto}
.tor-ah .k{margin-bottom:8px}
/* 4.35: las próximas 48 horas, en Ahora */
.h48-g{position:relative;height:220px;margin-top:2px}.h48-g.con-v{height:250px}
.h48-g>span.h48-v{font-size:20px;font-weight:800;color:var(--tx2);display:flex;align-items:center;gap:1px}.h48-v svg{width:18px;height:18px;fill:currentColor;flex:none}.h48-g>span.h48-v.f{color:#ffb454}body.claro .h48-g>span.h48-v.f{color:#d9600a}
.h48-ley i.vi{background:var(--tx2);opacity:.7;border-radius:50%}.h48-ley b.vr{color:var(--tx)}.h48-g>svg{position:absolute;left:0;width:100%;overflow:visible}.h48-a{fill:#f4a62a;opacity:.16}
.h48-l{fill:none;stroke:#f4a62a;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}.h48-ll{fill:var(--gota);opacity:.75}.h48-tor{fill:var(--rayo);opacity:.9}
.h48-d{stroke:var(--linea);stroke-width:2;vector-effect:non-scaling-stroke}.h48-g>span,.h48-ic{position:absolute;transform:translateX(-50%);white-space:nowrap;line-height:1}
.h48-ic{top:20px;font-style:normal}.h48-ic svg{display:block}.h48-t{font-size:20px;font-weight:800;color:var(--tx)}.h48-h{font-size:20px;font-weight:700;color:var(--mu)}
.h48-g>span.h48-dia{top:0;transform:none;font-size:20px;font-weight:800;color:var(--tx2);padding-left:6px}.h48-pt{font-size:20px;font-weight:800;color:var(--tx)}
.h48-mm{font-size:20px;font-weight:800;color:var(--gota)}.h48-ley{font-size:20px;color:var(--tx2);font-weight:600;margin-top:4px}.h48-ley i{display:inline-block;width:14px;height:14px;border-radius:3px;margin:0 6px -2px 0;vertical-align:baseline}
.h48-ley i.ll{background:var(--gota);opacity:.75}.h48-ley i.tor{background:var(--rayo);margin-left:10px}.h48-ley b.mm{color:var(--gota)}.h48 .k em b{color:var(--tx)}
.tor-barras div>b{position:absolute;left:0;margin-bottom:2px;font-size:20px;font-weight:800;color:var(--tx);white-space:nowrap;line-height:1}.tor-ah .tor-max{font-size:21px;margin:2px 0 6px}
.tor-ah .tor-u,.tor-ah .tor-d{font-size:20px;line-height:1.35;margin-top:4px;text-align:justify;hyphens:auto}
/* 4.26: Aire y sol, Clima, playas de la Junta */
.chip.aire{color:#fff}.tend-aire{font-size:21px;font-weight:800;margin:2px 0 4px}.tend-aire.peor{color:var(--mal)}.tend-aire.mejor{color:var(--ok)}
.uvt,.solt{display:flex;flex-direction:column}.uv-top{display:flex;align-items:center;gap:14px;margin-top:4px}.arco-uv{width:300px;flex:none}

const RECETAS = [
  [[1, 2, 3, 11, 12], "Potaje de acelgas", "Cuece garbanzos remojados con acelgas troceadas, una patata y un sofrito de ajo, cebolla y pimentón. Al final, un chorreón de aceite crudo."],
  [[1, 2, 3, 4], "Alcachofas a la plancha", "Limpia las alcachofas, pártelas por la mitad y cuécelas 8 minutos. Márcalas en la plancha con aceite, sal gorda y unas gotas de limón."],

const nombreMasa = m => esc(tit(m.nombre).replace(/ (De|Del|La|Las|Los|El|Y) /g, (x, w) => ` ${w.toLowerCase()} `));
const dentroDe = (lon, lat, anillos) => { let d = false;
  for (const a of anillos || []) for (let i = 0, j = a.length - 1; i < a.length; j = i++) if ((a[i][1] > lat) !== (a[j][1] > lat) && lon < (a[j][0] - a[i][0]) * (lat - a[i][1]) / (a[j][1] - a[i][1]) + a[i][0]) d = !d;

/* páginas de AEMET del municipio: la de 7 días viene en su XML; la de horas es la misma con «/horas» */

/* ---------- «Nuevo» (4.37, lo pidió Isa el 8 nov 2026: «remarca el contenido novedoso»; lo de 24 horas y las secciones nuevas; «prioriza si
   es novedad»): lo publicado en las últimas 24 horas (con su fecha y hora: la de la fuente); si la fuente solo da el día, que sea de hoy o de
   ayer y que haya salido en la tele por primera vez hace menos de 24 horas; sin fecha, lo que salió por primera vez hace menos de 24 horas.
   Se apunta en el navegador de la app cuándo se vio cada cosa por primera vez; la primera vez que se usa una lista no se marca nada de ella
   (si no, todo saldría como nuevo). Lo nuevo va delante en su lista. */
const SESION = Date.now(), CLAVE_VISTOS = "tiempo.vistos", H24 = 864e5;
let vistos = {}, primeraSesion = false, guardarVistosT = null;
try { const v = localStorage.getItem(CLAVE_VISTOS); if (v) vistos = JSON.parse(v) || {}; else primeraSesion = true; } catch (e) { primeraSesion = false; vistos = {}; }
const claveNuevo = k => `data-visto="${esc(k)}"`;
function msDe(f) {   // 1794075056 (segundos), «2026-11-08», «2026-11-08T10:05», «08/11/2026 10:05:33»
  if (f == null || f === "") return null;
  if (typeof f === "number" || /^\d{9,13}$/.test(String(f))) { const n = +f; return n < 1e12 ? n * 1000 : n; }
  const m = String(f).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\D+(\d{1,2}):(\d{2}))?/);
  if (m) return new Date(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
  const t = Date.parse(String(f).length === 10 ? f + "T00:00" : f);
  return isNaN(t) ? null : t;
}
const conHora = f => typeof f === "number" || /^\d{9,13}$/.test(String(f)) || /\d[T\s]+\d{1,2}:\d{2}/.test(String(f));
function esNuevo(k, f) {
  const ahora = Date.now(), t = msDe(f);
  if (t != null) {
    if (conHora(f)) return ahora - t < H24 && t - ahora < 6 * 36e5;
    if (isoDe(new Date(t)) < isoDe(new Date(ahora - H24))) return false;   // solo el día: de hoy o de ayer
  }
  if (primeraSesion) return false;
  const v = vistos[k];
  return v == null || (v > 0 && ahora - v < H24);
}
const marcaNuevo = (k, f) => esNuevo(k, f) ? `<i class="nuevo">Nuevo</i>` : "";
/* cada lista larga: cómo se llama cada fila (la misma clave que en claveNuevo) y su fecha de publicación */
const NOVEDAD = {
  sae: [o => "sae:" + o.id, o => o.desde], ofertas: [o => "of:" + o.id, o => o.publicada], bolsa: [n => "bolsa:" + n.enlace, n => n.fecha],

  cursosP: [g => g.ed.map(c => "cu:" + c.id)], cursosL: [g => g.ed.map(c => "cu:" + c.id)],

      ctx.fillStyle = "#ff3b1f"; ctx.beginPath(); ctx.arc(fx, fy, 7, 0, 7); ctx.fill();
    }
    const [x, y] = px(E.lugar.lon, E.lugar.lat);
    ctx.lineWidth = 4; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.stroke();
    ctx.fillStyle = "#f08a24"; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
    const f = R.frames[radarIdx], ultimo = radarIdx === R.frames.length - 1;
    const c = R.cerca || {};
    document.getElementById("radarHora").textContent = `Radar de lluvia · ${f.hora}${ultimo ? " · última imagen" : ""}${!R.ecos ? " · sin lluvia cerca" : c.km != null && !c.lloviendo ? ` · lluvia más cercana a ${Math.round(c.km)} km` : ""}${Ry ? " · con rayos" : ""}`;
    document.getElementById("radarProg").style.width = ((radarIdx + 1) / R.frames.length * 100).toFixed(1) + "%";
  }
  dibujarRadar = () => { if (document.getElementById("radar") === cv) dibujar(); };
  function cuadro() {
    dibujar();
    const ultimo = radarIdx === R.frames.length - 1;
    animTimer = setTimeout(() => { radarIdx = ultimo ? 0 : radarIdx + 1; cuadro(); }, ultimo ? 2500 : 450);
  }
  cuadro();
}
function satelite() {
  const cv = document.getElementById("sat"), S = E.satelite;
  if (satImgs.length !== S.length || satImgs.clave !== S[S.length - 1].url) {
    satImgs = S.map(f => { const im = new Image(); im.onload = () => { if (satImgs[satIdx] === im && dibujarSat) dibujarSat(); }; im.src = f.url; return im; });
    satImgs.clave = S[S.length - 1].url;
    satIdx = S.length - 1;
  }
  const ctx = cv.getContext("2d");
  function dibujar() {
    ctx.fillStyle = "#0e1a2c"; ctx.fillRect(0, 0, cv.width, cv.height);
    const im = satImgs[satIdx];
    if (im && im.complete && im.naturalWidth) {
      const k = im.naturalWidth / 800;   // recorte de la Península y el norte de África en la imagen de 800 px
      ctx.drawImage(im, 180 * k, 262 * k, 520 * k, 395 * k, 0, 0, cv.width, cv.height);
    }
    const ultimo = satIdx === S.length - 1;
    document.getElementById("satHora").textContent = `Satélite infrarrojo · ${S[satIdx].hora}${ultimo ? " · última imagen" : ""}`;
    document.getElementById("satProg").style.width = ((satIdx + 1) / S.length * 100).toFixed(1) + "%";
  }
  dibujarSat = () => { if (document.getElementById("sat") === cv) dibujar(); };
  function cuadro() {
    dibujar();
    const ultimo = satIdx === S.length - 1;
    animTimer = setTimeout(() => { satIdx = ultimo ? 0 : satIdx + 1; cuadro(); }, ultimo ? 2500 : 500);
  }
  cuadro();
}

/* ---------- calidad automática ----------
   Cada 5 minutos se mide durante 8 segundos cómo de fluida va la animación. Si la tele no da abasto
   (menos de 24 imágenes por segundo o muchos saltos), se quitan efectos de fondo; los datos no cambian.
   El nivel se recuerda 3 días y la app puede forzarlo (?calidad=N) si la página se ha caído. */
let calidad = 2;
try { const q = new URLSearchParams(location.search).get("calidad"); if (q !== null && q !== "") calidad = Math.max(0, Math.min(2, +q)); } catch (e) {}
const CALIDAD_V = 2;   // 4.26: la medida con los rayos de antes no vale
try { const g = JSON.parse(localStorage.getItem("calidad") || "null"); if (g && g.v === CALIDAD_V && Date.now() - g.t < 3 * 864e5) calidad = Math.min(calidad, g.n); } catch (e) {}
function aplicarCalidad() { document.documentElement.dataset.calidad = calidad; }
function rayosSol() {   // 4.26: los rayos del sol, una vez: 30 rayos de 3,5° cada 12°, que se apagan del 14 % al 70 % del radio
  const el = document.querySelector(".a-rayos"); if (!el) return;
  try {
    const n = 880, r = n / 2, cv = document.createElement("canvas"); cv.width = cv.height = n;
    const x = cv.getContext("2d"), g = Math.PI / 180;
    x.fillStyle = "rgba(255,205,110,.13)";
    for (let a = 0; a < 360; a += 12) { x.beginPath(); x.moveTo(r, r); x.arc(r, r, r, (a - 90) * g, (a + 3.5 - 90) * g); x.closePath(); x.fill(); }
    const m = x.createRadialGradient(r, r, 0, r, r, r); m.addColorStop(.14, "#000"); m.addColorStop(.7, "rgba(0,0,0,0)");
    x.globalCompositeOperation = "destination-in"; x.fillStyle = m; x.fillRect(0, 0, n, n);
    el.style.backgroundImage = `url(${cv.toDataURL()})`;
  } catch (e) {}
}
rayosSol();
aplicarCalidad();
function medirFluidez() {
  if (calidad === 0 || document.hidden) return;
  let n = 0, saltos = 0;
  const t0 = performance.now(); let antes = t0;
  function paso(t) {
    n++; if (t - antes > 50) saltos++; antes = t;
    if (t - t0 < 8000) { requestAnimationFrame(paso); return; }
    const fps = n / ((t - t0) / 1000);
    window.FLUIDEZ = {fps: Math.round(fps), saltos, calidad};
    if (fps < 24 || saltos / n > .25) {
      calidad--; aplicarCalidad();
      try { localStorage.setItem("calidad", JSON.stringify({n: calidad, t: Date.now(), v: CALIDAD_V})); } catch (e) {}
    }
  }
  requestAnimationFrame(paso);
}
setTimeout(medirFluidez, 90000);          // la primera, cuando ya ha pasado el arranque
setInterval(medirFluidez, 5 * 60000);

/* ---------- 4.3: el menú de ajustes de las pantallas (≡ en el mando, solo en la app) ----------
   ▲▼ elige · OK quita o pone la pantalla · ◀ ▶ cambia sus segundos (de 5 en 5) · « » la mueve · Atrás o ≡ cierra. Cada cambio se guarda. */
function filasMenu() { return [{t: "sitio"}].concat(ordenPantallas().map(p => ({t: "p", p})), [{t: "reset"}]); }
function pintarMenu() {
  let m = document.getElementById("menu");
  if (!menu) { if (m) m.remove(); return; }
  if (!m) { m = document.createElement("div"); m.id = "menu"; document.body.appendChild(m); }
  const hay = new Set(paginasHay()), F = filasMenu(), i = Math.max(0, Math.min(F.length - 1, menu.i));
  const fila = (f, k) => {
    const sel = k === i ? " sel" : "";
    if (f.t === "sitio") return `<li class="mn-x${sel}"><b>Cambiar el sitio</b><span>${esc(E && E.lugar ? E.lugar.nombre : "")}</span></li>`;
    if (f.t === "reset") return `<li class="mn-x${sel}"><b>Volver a como venía</b><span>todas, en su orden, 15 s</span></li>`;
    const off = AJ.ocultas.includes(f.p), s = segundosDe(f.p);
    return `<li class="${off ? "off" : "on"}${sel}"><i class="mn-n">${k}</i><b>${TITULOS[f.p]}</b>${hay.has(f.p) ? "" : `<em>sin datos ahora</em>`}`
      + `<span class="mn-v">${off ? "no sale" : "sale"}</span><span class="mn-s">${off ? "" : `◀ ${s} s ▶`}</span></li>`;
  };
  m.innerHTML = `<div class="mn"><div class="mn-k">Ajustes de las pantallas<em>se guardan solos · también en el salvapantallas</em></div>
    <ol class="${F.length > 24 ? "apretado" : ""}${F.length > 28 ? " apretado2" : ""}" style="grid-template-rows:repeat(${Math.ceil(F.length / 2)},auto)">${F.map(fila).join("")}</ol>
    ${menuMovil()}<div class="mn-ay"><span>▲ ▼ elegir</span><span>OK quitar o poner</span><span>◀ ▶ segundos</span><span>« » mover</span><span>Atrás o ≡ cerrar</span></div></div>`;
}
/* 4.19: el enlace para ver la página en un móvil de casa (lo sirve la app), con su QR; en el móvil no sale */
function menuMovil() {
  let u = ""; try { u = !window.MOVIL && window.Android && Android.movil ? Android.movil() : ""; } catch (e) {}
  const q = u ? qrSvg(u, "qr", 60) : "";
  return q ? `<div class="mn-movil">${q}<p><b>Verlo en el móvil</b>Con el móvil en la misma wifi que la tele, escanea el código o abre <u>${esc(u)}</u> (siempre el mismo mientras la tele tenga esa dirección).
    Allí: ◀ ▶ o deslizar cambia de pantalla, con dos dedos se amplía y 📍 cambia el municipio.</p></div>` : "";
}
function accionMenu(a) {
  const F = filasMenu();
  if (a === "abrir") {
    if (salvapantallas) return;
    const k = F.findIndex(f => f.p === actual);
    menu = {i: k >= 0 ? k : 1};
    try { Android.menu(true); } catch (e) {}
    pintarMenu(); return;
  }
  if (!menu) return;
  const f = F[menu.i] || {};
  if (a === "cerrar") {
    menu = null;
    try { Android.menu(false); } catch (e) {}
    pintarMenu(); paginaDesde = Date.now(); pintar(); return;
  }
  if (a === "arriba") menu.i = Math.max(0, menu.i - 1);
  else if (a === "abajo") menu.i = Math.min(F.length - 1, menu.i + 1);
  else if (a === "ok" && f.t === "sitio") {
    menu = null; pintarMenu();
    try { Android.cambiarSitio(); } catch (e) {}
    return;
  } else if (a === "ok" && f.t === "reset") { AJ = {orden: [], ocultas: [], seg: {}, ordenV: ORDEN_V}; guardarAjustes(); }
  else if (a === "ok" && f.t === "p") {
    AJ.ocultas = AJ.ocultas.includes(f.p) ? AJ.ocultas.filter(x => x !== f.p) : AJ.ocultas.concat(f.p);
    guardarAjustes();
  } else if ((a === "izq" || a === "der") && f.t === "p" && !AJ.ocultas.includes(f.p)) {
    const s = Math.max(SEG_MIN, Math.min(SEG_MAX, segundosDe(f.p) + (a === "der" ? 5 : -5)));
    if (s === SEG_DEF) delete AJ.seg[f.p]; else AJ.seg[f.p] = s;
    guardarAjustes();
  } else if ((a === "subir" || a === "bajar") && f.t === "p") {
    const o = ordenPantallas(), j = o.indexOf(f.p), k = j + (a === "subir" ? -1 : 1);
    if (k >= 0 && k < o.length) { [o[j], o[k]] = [o[k], o[j]]; AJ.orden = o; guardarAjustes(); menu.i += k - j; }
  }
  pintarMenu();
}

/* ---------- API para la app ---------- */
window.app = {
  actualizar(estado) {
    EB = estado; E = alDia(EB);
    // un aviso naranja o rojo nuevo salta a la vista enseguida (si no se está usando el mando)
    const nuevos = avisosFuertes().map(a => a.nivel + "|" + a.fenomeno + "|" + a.desde).filter(k => !avisosVistos.has(k));
    nuevos.forEach(k => avisosVistos.add(k));
    if (nuevos.length && rotando()) { actual = "aviso"; paginaDesde = Date.now(); pintar(); return; }
    /* con la pantalla rotando sola, lo que llega se pinta al cambiar de pantalla (como mucho 15 s después) y no con cada dato:
       llegan decenas por hora y cada pintado completo cuesta en la tele. Se pinta enseguida si se está usando el mando, si aún no
       hay nada pintado o se espera a los datos de hoy */
    if (rotando() && ultimaPintada && !esperando && Date.now() - paginaDesde < rota(actual) - 1500) return;
    pintar();
  },
  pagina(delta) {
    if (!E) return;
    const lista = paginas(), n = lista.length, k = lista.indexOf(actual);
    const i = actual === null ? pag : k >= 0 ? k : Math.min(pag, n) - (delta > 0 ? 1 : 0);   // si ya no está, la siguiente es la que ocupó su sitio
    pag = ((i + delta) % n + n) % n; actual = lista[pag]; paginaDesde = Date.now(); pintar();
  },
  tecla() { ultimaTecla = Date.now(); },
  menu(accion) { accionMenu(accion); },
  modoSalvapantallas(si) { salvapantallas = !!si; pintar(); },
};
setInterval(() => { const h = document.getElementById("hora"); if (!h) return; const d = new Date(), t = `${dosd(d.getHours())}:${dosd(d.getMinutes())}`; if (h.textContent !== t) h.textContent = t; }, 1000);
let esperando = false;
try { document.fonts.ready.then(() => { if (E) pintar(); }); } catch (e) {}
// si se pintó antes de cargar las letras, lo ajustado se midió con otras: al acabar de cargar se repinta (una vez por carga)
try { document.fonts.addEventListener("loadingdone", () => { if (E) pintar(); }); } catch (e) {}
setInterval(() => { if (E && esperando && !esperandoHoy()) pintar(); }, 2000);
// cada minuto: refresca cifras que dependen de la hora (cuenta atrás de la luz…) y cambia de tema al salir o ponerse el sol
setInterval(() => {
  if (!E) return;
  const tema = temaClaro() !== document.body.classList.contains("claro");
  // rotando, la pantalla cambia cada 15 s y ya se pinta entera: solo hace falta si cambia el tema o si lleva parada un rato
  if (tema || (!document.body.classList.contains("p-ahora") && (!rotando() || Date.now() - paginaDesde > 45000))) pintar();
}, 60000);
// rotación en bucle cada 15 s; en la app se para 60 s cuando se usa el mando
setInterval(() => { if (E && rotando() && Date.now() - paginaDesde >= rota(actual)) app.pagina(1); }, 500);
// en el salvapantallas el contenido se desplaza un poco cada minuto para no marcar la pantalla
setInterval(() => { if (salvapantallas) document.getElementById("wrap").style.transform = `translate(${Math.round(Math.random() * 16 - 8)}px,${Math.round(Math.random() * 12 - 6)}px)`; }, 60000);
function escalar() {
  const v = window.visualViewport, m = window.MOVIL, de = document.documentElement;
  // 4.19: en el móvil, el tamaño de la página sin ampliar (al ampliar con dos dedos no se encoge) y centrada; los botones, en movil.js
  const w = m ? de.clientWidth : v ? v.width : innerWidth, h = m ? de.clientHeight : v ? v.height : innerHeight;
  const s = Math.min(w / 1920, h / 1080);
  document.body.style.transform = (m ? `translate(${Math.round((w - 1920 * s) / 2)}px,${Math.round((h - 1080 * s) / 2)}px) ` : "") + `scale(${s})`;
  if (m && window.colocarMovil) colocarMovil(w, h, s);
}
addEventListener("resize", escalar); escalar();
try { Android.listo(); } catch (e) {}
</script>
